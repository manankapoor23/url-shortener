<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 4rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .5rem; font-size: 1rem; }
    button { padding: .5rem 1rem; font-size: 1rem; }
    #result { margin-top: 1rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <form id="form">
    <input id="url" type="text" placeholder="https://example.com/a/long/link" required>
    <button type="submit">Shorten</button>
  </form>
  <p id="result"></p>

  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.textContent = "";
      result.className = "";

      try {
        const res = await fetch("/api/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: document.getElementById("url").value }),
        });
        const data = await res.json();
        if (!res.ok) {
          result.className = "error";
          result.textContent = data.error;
          return;
        }
        // Build the link with DOM APIs (not innerHTML) so nothing is parsed as HTML.
        const link = document.createElement("a");
        link.href = data.short_url;
        link.textContent = data.short_url;
        result.append("Short link: ", link);
      } catch {
        result.className = "error";
        result.textContent = "Something went wrong, please try again.";
      }
    });
  </script>
</body>
</html>
